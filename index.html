<style id="location-share-style">.location-share-button{width:38px;height:38px;flex:0 0 38px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:20px}.location-share-button:hover{color:#1bdcff}.location-share-button:disabled{opacity:.45}@media(max-width:680px){.location-share-button{width:34px;flex-basis:34px}}</style>
<script id="location-share-script">
(function(){
 function addLocationButton(){
  document.querySelectorAll(".composer").forEach(function(composer){
   if(composer.querySelector(".location-share-button"))return;
   var field=composer.querySelector("input[placeholder=\"Escreva uma mensagem...\"]");
   if(!field)return;
   var button=document.createElement("button");
   button.type="button";button.className="location-share-button";button.setAttribute("aria-label","Compartilhar localização");button.title="Compartilhar localização";button.textContent="⌖";
   button.addEventListener("click",function(){
    if(!navigator.geolocation){alert("Este aparelho não permite acessar a localização.");return;}
    button.disabled=true;button.textContent="…";
    navigator.geolocation.getCurrentPosition(function(pos){
     var lat=pos.coords.latitude.toFixed(6),lng=pos.coords.longitude.toFixed(6);
     var text="📍 Minha localização: https://www.google.com/maps?q="+lat+","+lng;
     var setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value").set;setter.call(field,text);field.dispatchEvent(new Event("input",{bubbles:true}));
     setTimeout(function(){var send=composer.querySelector("button.send");if(send)send.click();button.disabled=false;button.textContent="⌖";},180);
    },function(err){button.disabled=false;button.textContent="⌖";alert(err.code===1?"Para enviar sua localização, permita o acesso nas configurações do navegador.":"Não foi possível obter sua localização agora.");},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
   });
   composer.insertBefore(button,field);
  });
 }
 new MutationObserver(addLocationButton).observe(document.documentElement,{childList:true,subtree:true});addLocationButton();
})();
</script>

<style id="camera-share-style">.camera-share-button{width:38px;height:38px;flex:0 0 38px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:20px}.camera-share-button:hover{color:#1bdcff}@media(max-width:680px){.camera-share-button{width:34px;flex-basis:34px}}</style>
<script id="camera-share-script">
(function(){
 function addCameraButton(){
  document.querySelectorAll(".composer").forEach(function(composer){
   if(composer.querySelector(".camera-share-button"))return;
   var fileInput=composer.querySelector("input[type=\"file\"].attachment-file");
   var attach=fileInput&&fileInput.closest("label");
   if(!fileInput||!attach)return;
   var button=document.createElement("button");button.type="button";button.className="camera-share-button";button.setAttribute("aria-label","Abrir câmera para foto ou vídeo");button.title="Foto ou vídeo";button.textContent="📷";
   button.addEventListener("click",function(){
    fileInput.setAttribute("accept","image/*,video/*");fileInput.setAttribute("capture","environment");fileInput.click();
    setTimeout(function(){fileInput.setAttribute("accept","image/*,video/*");fileInput.removeAttribute("capture");},1800);
   });
   attach.insertAdjacentElement("afterend",button);
  });
 }
 new MutationObserver(addCameraButton).observe(document.documentElement,{childList:true,subtree:true});addCameraButton();
})();
</script>

<style id="camera-mode-fix-style">.camera-mode-menu{z-index:9999;position:fixed;left:50%;bottom:150px;transform:translateX(-50%);display:flex;gap:8px;padding:10px;background:#0b1320;border:1px solid #ffffff22;border-radius:16px;box-shadow:0 14px 40px #000b}.camera-mode-menu button{width:auto!important;height:44px!important;padding:0 14px!important;border-radius:12px!important;background:#162235!important;color:#fff!important;font-weight:700}.camera-mode-menu button:first-child{background:#16cde8!important;color:#031017!important}</style>
<script id="camera-mode-fix-script">
(function(){
 function install(){
  document.querySelectorAll(".composer").forEach(function(composer){
   var old=composer.querySelector(".camera-share-button");if(!old||old.dataset.modeFix)return;
   var button=old.cloneNode(true);button.dataset.modeFix="1";old.replaceWith(button);
   button.addEventListener("click",function(){
    var previous=document.querySelector(".camera-mode-menu");if(previous)previous.remove();
    var menu=document.createElement("div");menu.className="camera-mode-menu";
    function openCamera(type){var input=composer.querySelector("input[type=\"file\"].attachment-file");if(!input)return;menu.remove();input.setAttribute("accept",type==="photo"?"image/*":"video/*");input.setAttribute("capture","environment");var restore=function(){setTimeout(function(){input.setAttribute("accept","image/*,video/*");input.removeAttribute("capture");},300);input.removeEventListener("change",restore)};input.addEventListener("change",restore);input.click()}
    var photo=document.createElement("button");photo.type="button";photo.textContent="📷 Tirar foto";photo.onclick=function(){openCamera("photo")};
    var video=document.createElement("button");video.type="button";video.textContent="🎥 Gravar vídeo";video.onclick=function(){openCamera("video")};
    menu.append(photo,video);document.body.appendChild(menu);
   });
  });
 }
 new MutationObserver(install).observe(document.documentElement,{childList:true,subtree:true});install();
})();
</script>
