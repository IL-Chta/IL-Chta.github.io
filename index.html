 async function installProfileTools(){var profile=document.querySelector(".profile");if(!profile||profile.dataset.toolsReady)return;var client=makeClient();if(!client)return;var session=await client.auth.getSession();var user=session.data&&session.data.session&&session.data.session.user;if(!user)return;var result=await client.from("profiles").select("username").eq("id",user.id).maybeSingle();var username=result.data&&result.data.username;if(!username)return;profile.dataset.toolsReady="1";var logout=profile.querySelector(".logout");var share=document.createElement("button");share.type="button";share.className="profile-share-button";share.innerHTML="🔗 Compartilhar meu contato <span>›</span>";share.onclick=async function(){var link=URL_BASE+"?contato="+encodeURIComponent(username);var text="Adicione @"+username+" no IL Chats: "+link;try{if(navigator.share)await navigator.share({title:"Meu contato no IL Chats",text:text,url:link});else{await navigator.clipboard.writeText(link);toast("Link do contato copiado!")}}catch(e){if(e.name!=="AbortError")toast("Não foi possível compartilhar agora.")}};profile.insertBefore(share,logout);var admin=await client.from("app_admins").select("user_id").eq("user_id",user.id).maybeSingle();if(admin.data){var h=profile.querySelector("h3");if(h){var badge=document.createElement("div");badge.className="admin-badge";badge.textContent="ADMINISTRADOR";h.insertAdjacentElement("afterend",badge)}var adminBtn=document.createElement("button");adminBtn.type="button";adminBtn.className="profile-admin-button";adminBtn.innerHTML="🛡️ Área do administrador <span>›</span>";adminBtn.onclick=function(){var modal=document.createElement("div");modal.className="il-tools-modal";modal.innerHTML="<div class=\"il-tools-card\"><h3>Conta administradora</h3><p>Sua conta está reconhecida como administradora do IL Chats. As ferramentas de denúncias e gerenciamento de usuários serão exibidas somente aqui.</p><button type=\"button\">Fechar</button></div>";modal.querySelect  function handleContactLink(){var wanted=new URLSearchParams(location.search).get("contato");if(!wanted||sessionStorage.getItem("il-contact-"+wanted))return;var tries=0;var timer=setInterval(function(){tries++;var contacts=[].slice.call(document.querySelectorAll("button")).filter(function(b){return b.textContent.trim()==="Contatos"&&b.offsetParent!==null});if(contacts[0])contacts[0].click();var search=document.querySelector("input[placeholder*=\"Buscar por nome\"]");if(search){var setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value").set;setter.call(search,wanted);search.dispatchEvent(new Event("input",{bubbles:true}));setTimeout(function(){var match=[].slice.call(document.querySelectorAll(".chat-list>button")).find(function(b){return b.textContent.toLowerCase().indexOf("@"+wanted.toLowerCase())>=0});if(match){match.click();sessionStorage.setItem("il-contact-"+wanted,"1");toast("Contato @"+wanted+" localizado.")}},500)}if(tries>25)clearInterval(timer)},500)}
 function install(){installGeminiDrag();installProfileTools();handleContactLink()}new MutationObserver(install).observe(document.documentElement,{childList:true,subtree:true});install();
})();
</script>
